B0S:
    code = 404
    status = '-'
    → B1 [always]
B1:
    match code:
    → B2 [case 200:]
    → B3 [case 201:]
    → B4 [case 404 | 410:]
    → B5 [case 301:]
    → B6 [case 400:]
    → B7 [case 401:]
    → B8 [case 403:]
    → B9 [case _:]
B2:
    status = 'ok'
    → B9 [always]
B3:
    status = 'created'
    → B9 [always]
B4:
    status = 'not found'
    → B9 [always]
B5:
    status = 'Moved Permanently'
    → B9 [always]
B6:
    status = 'Bad Request'
    → B9 [always]
B7:
    status = 'Unauthorized'
    → B9 [always]
B8:
    status = 'Forbidden'
    → B9 [always]
B9F:
    print(status)
