B0S:
    grade = 75
    → B1 [always]
B1:
    grade >= 90
    → B2 [True]
    → B3 [False]
B2:
    mark = 'A'
    → B4 [always]
B3:
    grade >= 80
    → B5 [True]
    → B6 [False]
B4F:
    print(mark)
B5:
    mark = 'B'
    → B4 [always]
B6:
    grade >= 70
    → B7 [True]
    → B8 [False]
B7:
    mark = 'C'
    → B4 [always]
B8:
    mark = 'F'
    → B4 [always]
